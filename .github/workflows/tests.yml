name: Offline tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check syntax
        run: python -m compileall -q server.py tests
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate experimental Cloudflare D1 scaffold
        run: python -m unittest discover -s cloudflare-experimental/tests -p "test_*.py" -v
      - name: Check experimental Worker JavaScript syntax
        run: node --check cloudflare-experimental/src/index.js
      - name: Validate OAuth split-worker safety architecture
        run: python -m unittest discover -s cloudflare-experimental/tests -p "test_oauth_architecture.py" -v
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Compile Cloudflare OAuth TypeScript against official package
        working-directory: cloudflare-experimental
        run: |
          npm install --no-audit --no-fund
          npm run check
      - name: Validate OAuth D1 one-time state and concurrency
        run: python -m unittest discover -s cloudflare-experimental/tests -p "test_oauth_d1_atomicity.py" -v
      - name: Execute TypeScript D1 gates with synthetic parallel and replay tests
        working-directory: cloudflare-experimental
        run: node --experimental-strip-types --test tests/test-state-gate.mjs
      - name: Exercise actual local D1 runtime via Miniflare (no deploy)
        working-directory: cloudflare-experimental
        run: timeout 90s npm run test:d1
      - name: Probe fail-closed OAuth routes in local Wrangler (no deployment)
        working-directory: cloudflare-experimental
        run: |
          npx wrangler dev --config wrangler-auth-local.json --local --ip 127.0.0.1 --port 8788 > /tmp/solvero-auth-wrangler.log 2>&1 &
          p=$!
          trap 'kill "$p" 2>/dev/null || true' EXIT
          for i in $(seq 1 35); do
            if curl -fsS -o /dev/null http://127.0.0.1:8788/unknown 2>/dev/null; then break; fi
            if curl -sS -o /dev/null http://127.0.0.1:8788/authorize 2>/dev/null; then break; fi
            sleep 1
          done
          status() { curl -sS -o /dev/null -w '%{http_code}' "$@"; }
          a=$(status http://127.0.0.1:8788/authorize || true)
          if [ "$a" = "000" ]; then cat /tmp/solvero-auth-wrangler.log; exit 1; fi
          b=$(status 'http://127.0.0.1:8788/google/callback?state=synthetic&code=synthetic')
          c=$(status -X POST -d 'id=synthetic&csrf=synthetic&decision=approve' http://127.0.0.1:8788/consent)
          echo "Local OAuth route statuses: authorize=$a callback=$b consent=$c"
          metadata_status=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8788/.well-known/oauth-authorization-server)
          echo "Authorization server RFC8414 discovery HTTP status: $metadata_status (not yet validated; tracked as pending)"
          test "$a" = 503 && test "$b" = 503 && test "$c" = 403 || { cat /tmp/solvero-auth-wrangler.log; exit 1; }
      - name: Run synthetic OAuth flow with local D1 and mocked Google
        working-directory: cloudflare-experimental
        run: timeout 45s node --experimental-strip-types --test tests/oauth-flow.test.mjs
      - name: Verify synthetic MCP Streamable HTTP JSON-RPC transport
        working-directory: cloudflare-experimental
        run: node --experimental-strip-types --test tests/mcp-transport.test.mjs
      - name: Official MCP SDK client interoperability over localhost HTTP
        working-directory: cloudflare-experimental
        run: timeout 45s node --experimental-strip-types --test tests/official-mcp-client.test.mjs
      - name: Validate OAuth resource discovery and scoped synthetic tokens via local Wrangler
        working-directory: cloudflare-experimental
        run: |
          npx wrangler dev --config wrangler-mcp-local.json --local --ip 127.0.0.1 --port 8789 > /tmp/solvero-resource.log 2>&1 &
          p=$!
          trap 'kill "$p" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -sS -o /dev/null http://127.0.0.1:8789/mcp 2>/dev/null; then break; fi
            sleep 1
          done
          status() { curl -sS -o /dev/null -w '%{http_code}' "$@"; }
          missing=$(status http://127.0.0.1:8789/mcp)
          invalid=$(status -H 'Authorization: Bearer not-a-token' http://127.0.0.1:8789/mcp)
          wrong_audience=$(status -H 'Authorization: Bearer synthetic-wrong-audience' http://127.0.0.1:8789/mcp)
          insufficient=$(status -H 'Authorization: Bearer synthetic-no-scope' http://127.0.0.1:8789/mcp)
          meta=$(curl -fsS http://127.0.0.1:8789/.well-known/oauth-protected-resource/mcp)
          META_JSON="$meta" python -c 'import os,json; j=json.loads(os.environ["META_JSON"]); assert j["resource"]=="http://127.0.0.1:8789/mcp"; assert "mcp:read" in j["scopes_supported"]; assert j["authorization_servers"]; print("RFC9728 protected resource metadata valid")'
          challenge=$(curl -sSI http://127.0.0.1:8789/mcp | grep -i 'www-authenticate' || true)
          echo "$challenge" | grep -iq 'resource_metadata'
          payload='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"synthetic","version":"1"}}}'
          init=$(curl -fsS -H 'Authorization: Bearer synthetic-read' -H 'Accept: application/json, text/event-stream' -H 'Content-Type: application/json' -d "$payload" http://127.0.0.1:8789/mcp)
          INIT_JSON="$init" python -c 'import os,json; j=json.loads(os.environ["INIT_JSON"]); assert j["result"]["serverInfo"]["name"]=="solvero-synthetic-experiment"; print("Authenticated MCP initialize valid")'
          echo "OAuth resource statuses missing=$missing invalid=$invalid wrong_audience=$wrong_audience insufficient=$insufficient"
          test "$missing" = 401 && test "$invalid" = 401 && test "$wrong_audience" = 401 && test "$insufficient" = 403 || { cat /tmp/solvero-resource.log; exit 1; }
      - name: Test local RFC8414 and connected Cloudflare Service Binding (no deployment)
        working-directory: cloudflare-experimental
        run: |
          npx wrangler dev --config wrangler-auth-binding-local.json --local --ip 127.0.0.1 --port 8798 > /tmp/solvero-auth-bound.log 2>&1 &
          auth_pid=$!
          npx wrangler dev --config wrangler-resource-binding-local.json --local --ip 127.0.0.1 --port 8799 > /tmp/solvero-mcp-bound.log 2>&1 &
          mcp_pid=$!
          trap 'kill "$auth_pid" "$mcp_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 25); do
            auth_code=$(curl --max-time 2 -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8798/.well-known/oauth-authorization-server || true)
            mcp_code=$(curl --max-time 2 -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8799/mcp || true)
            if [ "$auth_code" = "200" ] && [ "$mcp_code" = "401" ]; then break; fi
            sleep 1
          done
          echo "Issuer discovery=$auth_code resource challenge=$mcp_code"
          if [ "$auth_code" != "200" ] || [ "$mcp_code" != "401" ]; then cat /tmp/solvero-auth-bound.log /tmp/solvero-mcp-bound.log; exit 1; fi
          curl -fsS http://127.0.0.1:8798/.well-known/oauth-authorization-server | python -c 'import json,sys; d=json.load(sys.stdin); assert d["issuer"]=="http://127.0.0.1:8798"; assert "S256" in d["code_challenge_methods_supported"]; assert "revocation_endpoint" in d; print("RFC8414 issuer discovery with PKCE and revocation: OK")'
          curl -fsS http://127.0.0.1:8799/.well-known/oauth-protected-resource/mcp | python -c 'import json,sys; d=json.load(sys.stdin); assert d["resource"]=="http://127.0.0.1:8799/mcp"; assert "http://127.0.0.1:8798" in d["authorization_servers"]; print("RFC9728 resource metadata: OK")'
          challenge=$(curl -sD - -o /dev/null http://127.0.0.1:8799/mcp)
          echo "$challenge" | grep -qi 'WWW-Authenticate: Bearer'
          echo "$challenge" | grep -qi 'resource_metadata'
          invalid=$(curl -s -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer invalid-token' http://127.0.0.1:8799/mcp)
          test "$invalid" = 401
          issue() { curl -fsS -H 'Content-Type: application/json' -d "$1" http://127.0.0.1:8798/__synthetic/issue | python -c 'import json,sys; print(json.load(sys.stdin)["token"])'; }
          token=$(issue '{"scope":"mcp:read"}')
          no_scope=$(issue '{"scope":""}')
          wrong_audience=$(issue '{"audience":"http://127.0.0.1:8799/other"}')
          expired=$(issue '{"expires":-1000}')
          code() { curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $1" http://127.0.0.1:8799/mcp; }
          test "$(code "$no_scope")" = 403
          test "$(code "$wrong_audience")" = 401
          test "$(code "$expired")" = 401
          payload='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"synthetic","version":"1"}}}'
          init=$(curl -fsS -H "Authorization: Bearer $token" -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' -d "$payload" http://127.0.0.1:8799/mcp)
          INIT_JSON="$init" python -c 'import json,os; assert json.loads(os.environ["INIT_JSON"])["result"]["serverInfo"]["name"]=="solvero-synthetic-experiment"; print("Bound MCP initialize: OK")'
          listing='{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}'
          result=$(curl -fsS -H "Authorization: Bearer $token" -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' -d "$listing" http://127.0.0.1:8799/mcp)
          LIST_JSON="$result" python -c 'import json,os; assert [x["name"] for x in json.loads(os.environ["LIST_JSON"])["result"]["tools"]]==["synthetic_archive_status"]; print("Bound MCP tools/list: OK")'
          curl -fsS -H 'Content-Type: application/json' -d "{\\"token\\":\\"$token\\"}" http://127.0.0.1:8798/__synthetic/revoke >/dev/null
          test "$(code "$token")" = 401
          echo "Local OAuth synthetic issue/validate/revoke, audience, scopes, expiry: OK"
