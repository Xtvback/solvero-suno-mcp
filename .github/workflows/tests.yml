name: Offline tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check syntax
        run: python -m compileall -q server.py tests
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate experimental Cloudflare D1 scaffold
        run: python -m unittest discover -s cloudflare-experimental/tests -p "test_*.py" -v
      - name: Check experimental Worker JavaScript syntax
        run: node --check cloudflare-experimental/src/index.js
      - name: Validate OAuth split-worker safety architecture
        run: python -m unittest discover -s cloudflare-experimental/tests -p "test_oauth_architecture.py" -v
