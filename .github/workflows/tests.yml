name: Offline tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt httpx
      - name: Check syntax
        run: python -m compileall -q server.py tests
      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v
