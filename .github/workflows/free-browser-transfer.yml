name: Free browser transfer smoke test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transfer-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Playwright
        run: |
          python -m pip install "playwright>=1.50,<2"
          python -m playwright install --with-deps chromium
      - name: Capture synthetic browser download
        run: python tests/browser_transfer_smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: safe-transfer-smoke-test
          path: transfer-test/test-transfer.txt
          if-no-files-found: error
          retention-days: 1
