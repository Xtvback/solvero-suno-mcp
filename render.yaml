services:
  - type: web
    name: solvero-suno-mcp
    runtime: docker
    plan: free
    autoDeployTrigger: commit
    healthCheckPath: /health
    envVars:
      - key: AUTH0_ISSUER
        value: "https://solvero-mcp.eu.auth0.com/"
      - key: AUTH0_AUDIENCE
        value: "https://solvero-suno-mcp.onrender.com/mcp"
      - key: AUTH0_REQUIRED_SCOPE
        value: "mcp:tools"
      - key: PORT
        value: "10000"
